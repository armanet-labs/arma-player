name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: player-${{ github.sha }}
          path: |
            dist/fluidplayer.min.js
            dist/fluidplayer.min.js.LICENSE.txt
          if-no-files-found: error
          retention-days: 30
